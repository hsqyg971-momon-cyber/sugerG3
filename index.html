<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フクロモモンガのポーチダイブ</title>
    <!-- Tailwind CSS for styling UI wrapper -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #064e3b;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            background: #ecfdf5;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 m-0 w-full h-full">

    <div class="relative w-full max-w-[480px] h-[100dvh] max-h-[850px] flex flex-col items-center justify-center">
        <!-- Canvas Element -->
        <canvas id="gameCanvas" width="480" height="800" class="w-full h-full object-contain rounded-2xl"></canvas>
    </div>

<script>
(() => {
    // Canvas & Context Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 480;
    const V_HEIGHT = 800;

    // --- Web Audio API Implementation (No external files) ---
    class SoundController {
        constructor() {
            this.ctx = null;
            this.muted = false;
        }

        init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playDive() {
            if (!this.ctx || this.muted) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime;

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.18);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.18);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.18);
        }

        playGlide() {
            if (!this.ctx || this.muted) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(390, now + 0.12);

            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.12);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.12);
        }

        playSuccess(isPerfect) {
            if (!this.ctx || this.muted) return;
            const now = this.ctx.currentTime;
            const notes = isPerfect ? [523.25, 659.25, 783.99, 1046.50] : [523.25, 659.25, 783.99];

            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const noteTime = now + (i * 0.07);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, noteTime);

                gain.gain.setValueAtTime(0.25, noteTime);
                gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.22);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(noteTime);
                osc.stop(noteTime + 0.22);
            });
        }

        playFail() {
            if (!this.ctx || this.muted) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const now = this.ctx.currentTime;

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(75, now + 0.3);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    const sounds = new SoundController();

    // --- Image Loader with Auto-Transparency Preprocessing ---
    const gliderRawImg = new Image();
    gliderRawImg.src = 'sugar_glider.png';
    let isImageLoaded = false;
    let processedGliderCanvas = null; // 通常時（透過済みCanvas）

    // 滑空用画像
    const gliderFlyRawImg = new Image();
    gliderFlyRawImg.src = 'sugar_glider_fly.png';
    let isFlyImageLoaded = false;
    let processedGliderFlyCanvas = null; // 滑空時（透過済みCanvas）

    // 画像の白背景を透過処理してオフスクリーンCanvasを返すヘルパー関数
    function makeTransparentCanvas(img) {
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        offCanvas.width = w;
        offCanvas.height = h;

        offCtx.drawImage(img, 0, 0);

        try {
            const imgData = offCtx.getImageData(0, 0, w, h);
            const data = imgData.data;

            // 白〜薄い背景（RGBが238以上）を透明化
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                if (r > 238 && g > 238 && b > 238) {
                    data[i + 3] = 0;
                } else if (r > 220 && g > 220 && b > 220) {
                    const factor = (238 - Math.min(r, g, b)) / 18;
                    data[i + 3] = Math.floor(data[i + 3] * Math.max(0, factor));
                }
            }
            offCtx.putImageData(imgData, 0, 0);
            return offCanvas;
        } catch (err) {
            console.warn('透過処理スキップ:', err);
            return null;
        }
    }

    gliderRawImg.onload = () => {
        processedGliderCanvas = makeTransparentCanvas(gliderRawImg);
        isImageLoaded = true;
    };
    gliderRawImg.onerror = () => { isImageLoaded = false; };

    gliderFlyRawImg.onload = () => {
        processedGliderFlyCanvas = makeTransparentCanvas(gliderFlyRawImg);
        isFlyImageLoaded = true;
    };
    gliderFlyRawImg.onerror = () => { isFlyImageLoaded = false; };

    // --- Particle System ---
    class Particle {
        constructor(x, y, color, speed, size, life) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * speed;
            this.vy = (Math.random() - 0.5) * speed;
            this.size = size;
            this.maxLife = life;
            this.life = life;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.05; // Light gravity
            this.life--;
        }

        draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- Floating Text Effect ---
    class FloatingText {
        constructor(text, x, y, color, size = 26) {
            this.text = text;
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = size;
            this.alpha = 1.0;
            this.life = 45;
        }

        update() {
            this.y -= 1.2;
            this.life--;
            this.alpha = Math.max(0, this.life / 45);
        }

        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.font = `bold ${this.size}px 'Arial Rounded MT Bold', sans-serif`;
            ctx.fillStyle = this.color;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.strokeText(this.text, this.x, this.y);
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    // --- Game States ---
    const STATE = {
        TITLE: 'TITLE',
        PLAYING: 'PLAYING',
        GAMEOVER: 'GAMEOVER'
    };

    let gameState = STATE.TITLE;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('sg_pouch_dive_best') || '0', 10);
    let lives = 3;
    let level = 1;
    let particles = [];
    let floatingTexts = [];

    // --- Morning Forest Background Elements (Leaves & Sun Motes) ---
    const forestMotes = Array.from({ length: 30 }, () => ({
        x: Math.random() * V_WIDTH,
        y: Math.random() * V_HEIGHT,
        radius: Math.random() * 2.5 + 1.2,
        alpha: Math.random() * 0.6 + 0.3,
        speedY: Math.random() * 0.4 + 0.2,
        speedX: (Math.random() - 0.5) * 0.3,
        pulseSpeed: Math.random() * 0.03 + 0.015,
        type: Math.random() > 0.4 ? 'light' : 'leaf'
    }));

    // --- Glider Object ---
    const GLIDER_STATE = {
        ON_BRANCH: 'ON_BRANCH',
        DIVING: 'DIVING',
        GLIDING: 'GLIDING',
        IN_POUCH: 'IN_POUCH',
        FELL: 'FELL'
    };

    const glider = {
        x: V_WIDTH / 2,
        y: 110,
        width: 70,
        height: 70,
        vx: 2.5,
        vy: 0,
        state: GLIDER_STATE.ON_BRANCH,
        glideCharges: 1, // Can glide once during a fall
        scale: 1,
        angle: 0,
        timer: 0,
        pouchOffset: { x: 0, y: 0 },

        reset() {
            this.x = V_WIDTH / 2;
            this.y = 110;
            const dir = Math.random() > 0.5 ? 1 : -1;
            this.vx = (2.2 + Math.min(level * 0.3, 3)) * dir;
            this.vy = 0;
            this.state = GLIDER_STATE.ON_BRANCH;
            this.glideCharges = 1;
            this.scale = 1;
            this.angle = 0;
            this.timer = 0;
            this.pouchOffset = { x: 0, y: 0 };
        },

        dive() {
            if (this.state === GLIDER_STATE.ON_BRANCH) {
                this.state = GLIDER_STATE.DIVING;
                this.vy = 2.0;
                sounds.playDive();
            } else if (this.state === GLIDER_STATE.DIVING && this.glideCharges > 0) {
                // Glide action: Slow descent, slight boost in horizontal travel
                this.state = GLIDER_STATE.GLIDING;
                this.glideCharges--;
                this.vy = 1.0;
                this.vx *= 1.25;
                sounds.playGlide();
            }
        },

        update() {
            this.timer++;

            if (this.state === GLIDER_STATE.ON_BRANCH) {
                this.x += this.vx;
                const margin = 50;
                if (this.x < margin) {
                    this.x = margin;
                    this.vx = Math.abs(this.vx);
                } else if (this.x > V_WIDTH - margin) {
                    this.x = V_WIDTH - margin;
                    this.vx = -Math.abs(this.vx);
                }
                this.angle = Math.sin(this.timer * 0.1) * 0.08;
            } else if (this.state === GLIDER_STATE.DIVING || this.state === GLIDER_STATE.GLIDING) {
                const isGliding = this.state === GLIDER_STATE.GLIDING;
                
                // Movement
                this.x += this.vx * (isGliding ? 0.7 : 0.5);
                this.vy += isGliding ? 0.09 : 0.28;
                this.y += this.vy;
                this.angle = this.vx * (isGliding ? 0.08 : 0.05);

                // --- Wall bounce (左右の端でバウンドして反射) ---
                const halfWidth = this.width / 2;
                if (this.x - halfWidth <= 0) {
                    this.x = halfWidth;
                    this.vx = Math.abs(this.vx) * 0.9; // 向きを反転して少し減速バウンド
                    this.createBounceParticles(this.x, this.y);
                } else if (this.x + halfWidth >= V_WIDTH) {
                    this.x = V_WIDTH - halfWidth;
                    this.vx = -Math.abs(this.vx) * 0.9;
                    this.createBounceParticles(this.x, this.y);
                }

                // Wind trail particles when gliding
                if (isGliding && this.timer % 3 === 0) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 30,
                        this.y + 20,
                        '#ffffff',
                        1,
                        2,
                        20
                    ));
                }
            } else if (this.state === GLIDER_STATE.IN_POUCH) {
                // Follow the pouch smoothly with gentle peek bobbing
                this.x = pouch.x + this.pouchOffset.x;
                this.y = pouch.y + this.pouchOffset.y + Math.sin(this.timer * 0.15) * 4;
            } else if (this.state === GLIDER_STATE.FELL) {
                this.y += this.vy;
                this.vy += 0.4;
                this.angle += 0.1;
            }

            // Screen boundary checks for falling
            if ((this.state === GLIDER_STATE.DIVING || this.state === GLIDER_STATE.GLIDING) && this.y > V_HEIGHT + 60) {
                handleMiss();
            }
        },

        createBounceParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push(new Particle(
                    x,
                    y + (Math.random() - 0.5) * 20,
                    '#fef08a',
                    3.5,
                    3,
                    15
                ));
            }
        },

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            // 進行方向（vx）に合わせて左右反転（滑空時は飛ぶ方向に体を向ける）
            const flipX = (this.vx < 0) ? -1 : 1;
            ctx.scale(this.scale * flipX, this.scale);

            const isGliding = (this.state === GLIDER_STATE.GLIDING);

            // 滑空状態かつ滑空画像がある場合は滑空スプライトを描画
            if (isGliding && (isFlyImageLoaded || processedGliderFlyCanvas)) {
                const renderFlySource = processedGliderFlyCanvas || gliderFlyRawImg;
                ctx.drawImage(
                    renderFlySource,
                    -this.width / 2 - 8,
                    -this.height / 2 - 8,
                    this.width + 16,
                    this.height + 16
                );
            } else if (isImageLoaded || processedGliderCanvas) {
                // 通常スプライトを描画
                const renderSource = processedGliderCanvas || gliderRawImg;
                ctx.drawImage(
                    renderSource,
                    -this.width / 2,
                    -this.height / 2,
                    this.width,
                    this.height
                );
            } else {
                // Fallback procedural Sugar Glider avatar
                this.drawFallbackGlider(ctx);
            }

            ctx.restore();
        },

        drawFallbackGlider(ctx) {
            // Glider Body
            ctx.fillStyle = '#b48a60';
            ctx.beginPath();
            ctx.ellipse(0, 0, 26, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // Belly
            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.ellipse(0, 5, 17, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Gliding Patagium (Membrane) preview when in flight
            if (this.state === GLIDER_STATE.GLIDING) {
                ctx.fillStyle = '#996e45';
                ctx.beginPath();
                ctx.arc(-26, 0, 16, Math.PI * 0.5, Math.PI * 1.5);
                ctx.arc(26, 0, 16, Math.PI * 1.5, Math.PI * 0.5);
                ctx.fill();
            }

            // Large Ears
            ctx.fillStyle = '#8b5a32';
            ctx.beginPath();
            ctx.ellipse(-18, -24, 9, 13, -0.3, 0, Math.PI * 2);
            ctx.ellipse(18, -24, 9, 13, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.ellipse(-18, -24, 5, 8, -0.3, 0, Math.PI * 2);
            ctx.ellipse(18, -24, 5, 8, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Signature Big Eyes
            ctx.fillStyle = '#1e1b4b';
            ctx.beginPath();
            ctx.arc(-9, -6, 6.5, 0, Math.PI * 2);
            ctx.arc(9, -6, 6.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye Highlights
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-7.5, -8, 2.5, 0, Math.PI * 2);
            ctx.arc(10.5, -8, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#f472b6';
            ctx.beginPath();
            ctx.ellipse(0, -1, 3, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    // --- Pouch (Target) Object ---
    const pouch = {
        baseX: V_WIDTH / 2,
        x: V_WIDTH / 2,
        y: 670,
        width: 130,
        height: 100,
        swingAngle: 0,
        swingAmplitude: 140,
        speed: 0.028,
        time: 0,

        update() {
            this.time += this.speed;
            this.x = this.baseX + Math.sin(this.time) * this.swingAmplitude;
            this.swingAngle = Math.cos(this.time) * 0.12;
        },

        drawRopeAndBack(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.swingAngle);

            // Suspension straps
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-45, -20);
            ctx.lineTo(-20, -130);
            ctx.moveTo(45, -20);
            ctx.lineTo(20, -130);
            ctx.stroke();

            // Pouch Interior (Dark inner depth)
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.ellipse(0, 10, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        },

        drawFront(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.swingAngle);

            // Front pouch flap / fabric
            const gradient = ctx.createLinearGradient(0, 0, 0, 60);
            gradient.addColorStop(0, '#38bdf8');
            gradient.addColorStop(1, '#0284c7');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(-this.width / 2, 0);
            ctx.quadraticCurveTo(0, 20, this.width / 2, 0);
            ctx.bezierCurveTo(this.width / 2 + 5, 60, -this.width / 2 - 5, 60, -this.width / 2, 0);
            ctx.fill();

            // Pouch Rim (Fluffy border)
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.ellipse(0, 0, this.width / 2, 16, 0, 0, Math.PI);
            ctx.stroke();

            // Decorative paw stitch
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(0, 32, 6, 0, Math.PI * 2);
            ctx.arc(-8, 22, 3, 0, Math.PI * 2);
            ctx.arc(0, 20, 3, 0, Math.PI * 2);
            ctx.arc(8, 22, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    };

    // --- Branch / Perch Object ---
    function drawBranch(ctx) {
        ctx.save();
        ctx.strokeStyle = '#573419';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(10, 110);
        ctx.quadraticCurveTo(V_WIDTH / 2, 125, V_WIDTH - 10, 110);
        ctx.stroke();

        // Little leaves
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.ellipse(70, 102, 12, 6, -0.4, 0, Math.PI * 2);
        ctx.ellipse(V_WIDTH - 80, 105, 12, 6, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // --- Collision & Event Handlers ---
    let respawnTimer = null;

    function checkCollision() {
        if (glider.state !== GLIDER_STATE.DIVING && glider.state !== GLIDER_STATE.GLIDING) return;

        // Catch mouth target zone
        const targetY = pouch.y;
        const targetRadiusX = pouch.width / 2;
        const targetRadiusY = 28;

        const dx = glider.x - pouch.x;
        const dy = glider.y - targetY;

        // Elliptical hit test for the pouch entrance
        const normalizedDist = (dx * dx) / (targetRadiusX * targetRadiusX) + (dy * dy) / (targetRadiusY * targetRadiusY);

        if (normalizedDist <= 1.0) {
            handleSuccess(Math.abs(dx));
        } else if (glider.y > pouch.y + 40 && Math.abs(dx) < pouch.width / 2 + 25) {
            // Glider hit the pouch rim/edge and bounced off
            handleBounce();
        }
    }

    function handleSuccess(distFromCenter) {
        glider.state = GLIDER_STATE.IN_POUCH;
        glider.pouchOffset = { x: (glider.x - pouch.x) * 0.4, y: 5 };
        glider.scale = 0.82;

        const isPerfect = distFromCenter < 18;
        const points = isPerfect ? 200 : 100;
        score += points;

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('sg_pouch_dive_best', bestScore);
        }

        // Floating label
        floatingTexts.push(new FloatingText(
            isPerfect ? 'PERFECT! +200' : 'GREAT! +100',
            pouch.x,
            pouch.y - 40,
            isPerfect ? '#facc15' : '#38bdf8',
            isPerfect ? 30 : 24
        ));

        // Confetti explosion
        const colors = isPerfect ? ['#facc15', '#f43f5e', '#a855f7', '#38bdf8'] : ['#38bdf8', '#4ade80', '#fbbf24'];
        for (let i = 0; i < (isPerfect ? 35 : 20); i++) {
            particles.push(new Particle(
                pouch.x + (Math.random() - 0.5) * 40,
                pouch.y,
                colors[Math.floor(Math.random() * colors.length)],
                6,
                Math.random() * 3 + 2,
                45
            ));
        }

        sounds.playSuccess(isPerfect);

        // Level scaling
        level++;
        pouch.speed = Math.min(0.028 + level * 0.003, 0.065);
        pouch.swingAmplitude = Math.min(140 + level * 6, 190);

        scheduleRespawn(900);
    }

    function handleBounce() {
        glider.state = GLIDER_STATE.FELL;
        glider.vx = glider.vx > 0 ? 3 : -3;
        glider.vy = -3; // slight bounce
        sounds.playFail();

        floatingTexts.push(new FloatingText('MISS...', glider.x, glider.y - 20, '#ef4444', 24));
        deductLife();
    }

    function handleMiss() {
        glider.state = GLIDER_STATE.FELL;
        sounds.playFail();
        floatingTexts.push(new FloatingText('MISS...', pouch.x, pouch.y - 30, '#ef4444', 24));
        deductLife();
    }

    function deductLife() {
        lives--;
        if (lives <= 0) {
            setTimeout(() => {
                gameState = STATE.GAMEOVER;
            }, 700);
        } else {
            scheduleRespawn(900);
        }
    }

    function scheduleRespawn(delayMs) {
        if (respawnTimer) clearTimeout(respawnTimer);
        respawnTimer = setTimeout(() => {
            glider.reset();
        }, delayMs);
    }

    function startNewGame() {
        score = 0;
        lives = 3;
        level = 1;
        pouch.speed = 0.028;
        pouch.swingAmplitude = 140;
        particles = [];
        floatingTexts = [];
        gameState = STATE.PLAYING;
        glider.reset();
    }

    // --- Input Handling ---
    function triggerAction() {
        sounds.init();

        if (gameState === STATE.TITLE) {
            startNewGame();
        } else if (gameState === STATE.PLAYING) {
            glider.dive();
        } else if (gameState === STATE.GAMEOVER) {
            startNewGame();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowDown') {
            e.preventDefault();
            triggerAction();
        }
    });

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        triggerAction();
    });

    // --- Drawing Functions ---
    function drawBackground(ctx) {
        // Bright Morning Sky & Forest Gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
        bgGrad.addColorStop(0, '#7dd3fc');    // Clear morning blue sky
        bgGrad.addColorStop(0.35, '#bae6fd'); // Gentle horizon glow
        bgGrad.addColorStop(0.65, '#a7f3d0'); // Canopy light green
        bgGrad.addColorStop(1, '#15803d');    // Rich forest floor green
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Soft Morning Sun Rays (木漏れ日)
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(160, 0);
        ctx.lineTo(280, V_HEIGHT);
        ctx.lineTo(80, V_HEIGHT);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(180, 0);
        ctx.lineTo(320, 0);
        ctx.lineTo(V_WIDTH + 40, V_HEIGHT);
        ctx.lineTo(V_WIDTH - 80, V_HEIGHT);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Morning Sun (朝のやさしい太陽)
        const sunGrad = ctx.createRadialGradient(V_WIDTH - 70, 75, 10, V_WIDTH - 70, 75, 90);
        sunGrad.addColorStop(0, 'rgba(254, 240, 138, 0.9)');
        sunGrad.addColorStop(0.4, 'rgba(253, 224, 71, 0.4)');
        sunGrad.addColorStop(1, 'rgba(253, 224, 71, 0)');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(V_WIDTH - 70, 75, 90, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(V_WIDTH - 70, 75, 28, 0, Math.PI * 2);
        ctx.fill();

        // Distant Trees Silhouette
        ctx.save();
        ctx.fillStyle = 'rgba(21, 128, 61, 0.35)';
        for (let i = -1; i < 6; i++) {
            ctx.beginPath();
            ctx.arc(i * 105, 520, 75, Math.PI, 0);
            ctx.fill();
        }
        ctx.fillStyle = 'rgba(15, 118, 110, 0.4)';
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.arc(i * 120 + 40, 560, 90, Math.PI, 0);
            ctx.fill();
        }
        ctx.restore();

        // Floating Sun Motes & Gentle Morning Leaves
        forestMotes.forEach(mote => {
            mote.y += mote.speedY;
            mote.x += mote.speedX;
            mote.alpha += mote.pulseSpeed;
            if (mote.alpha > 0.8 || mote.alpha < 0.25) mote.pulseSpeed = -mote.pulseSpeed;

            // Wrap around screen
            if (mote.y > V_HEIGHT + 10) mote.y = -10;
            if (mote.x < -10) mote.x = V_WIDTH + 10;
            if (mote.x > V_WIDTH + 10) mote.x = -10;

            ctx.save();
            ctx.globalAlpha = Math.max(0.1, Math.min(1, mote.alpha));
            if (mote.type === 'light') {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(mote.x, mote.y, mote.radius, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#86efac';
                ctx.beginPath();
                ctx.ellipse(mote.x, mote.y, mote.radius * 1.8, mote.radius, 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });
    }

    function drawHUD(ctx) {
        // Score Display
        ctx.save();
        ctx.font = "bold 26px 'Arial Rounded MT Bold', sans-serif";
        ctx.fillStyle = "#064e3b";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.textAlign = "left";
        ctx.strokeText(`SCORE: ${score}`, 24, 48);
        ctx.fillText(`SCORE: ${score}`, 24, 48);

        // Best Score
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = "#047857";
        ctx.strokeText(`BEST: ${bestScore}`, 24, 72);
        ctx.fillText(`BEST: ${bestScore}`, 24, 72);

        // Lives indicator (Heart icons)
        ctx.textAlign = "right";
        let hearts = '';
        for (let i = 0; i < 3; i++) {
            hearts += i < lives ? '❤️ ' : '🤍 ';
        }
        ctx.font = "20px sans-serif";
        ctx.fillText(hearts.trim(), V_WIDTH - 24, 48);

        // Glider state helper text
        if (glider.state === GLIDER_STATE.DIVING && glider.glideCharges > 0) {
            ctx.textAlign = "center";
            ctx.font = "bold 15px sans-serif";
            ctx.fillStyle = "#0369a1";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeText("TAP AGAIN TO GLIDE!", V_WIDTH / 2, 160);
            ctx.fillText("TAP AGAIN TO GLIDE!", V_WIDTH / 2, 160);
        }

        ctx.restore();
    }

    function drawTitleScreen(ctx) {
        // Dim overlay with gentle warm morning tint
        ctx.fillStyle = 'rgba(6, 78, 59, 0.7)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.save();
        ctx.textAlign = 'center';

        // Title text
        ctx.font = "bold 32px 'Arial Rounded MT Bold', sans-serif";
        ctx.fillStyle = '#facc15';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 10;
        ctx.fillText('フクロモモンガの', V_WIDTH / 2, 280);

        ctx.font = "bold 44px 'Arial Rounded MT Bold', sans-serif";
        ctx.fillStyle = '#ffffff';
        ctx.fillText('ポーチダイブ！', V_WIDTH / 2, 335);

        // Icon preview
        ctx.shadowBlur = 0;
        if (isImageLoaded) {
            const renderSource = processedGliderCanvas || gliderRawImg;
            ctx.drawImage(renderSource, V_WIDTH / 2 - 50, 370, 100, 100);
        } else {
            glider.drawFallbackGlider(ctx);
        }

        // Instructions
        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('タップで枝から飛び降り！', V_WIDTH / 2, 510);
        ctx.fillText('落下中にもう一度タップで滑空微調整！', V_WIDTH / 2, 538);
        ctx.fillText('ゆれるポーチにスポッと入ろう！', V_WIDTH / 2, 566);

        // Start Prompt Button
        const pulse = 1 + Math.sin(Date.now() * 0.006) * 0.05;
        ctx.save();
        ctx.translate(V_WIDTH / 2, 640);
        ctx.scale(pulse, pulse);

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(-110, -26, 220, 52, 26);
        ctx.fill();

        ctx.font = "bold 22px 'Arial Rounded MT Bold', sans-serif";
        ctx.fillStyle = '#0f172a';
        ctx.fillText('START GAME', 0, 8);
        ctx.restore();

        ctx.restore();
    }

    function drawGameOverScreen(ctx) {
        // Dim overlay
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.save();
        ctx.textAlign = 'center';

        ctx.font = "bold 42px 'Arial Rounded MT Bold', sans-serif";
        ctx.fillStyle = '#f87171';
        ctx.fillText('GAME OVER', V_WIDTH / 2, 290);

        ctx.font = '20px sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(`SCORE: ${score}`, V_WIDTH / 2, 360);

        ctx.font = 'bold 22px sans-serif';
        ctx.fillStyle = '#facc15';
        ctx.fillText(`BEST SCORE: ${bestScore}`, V_WIDTH / 2, 400);

        // Retry Button
        const pulse = 1 + Math.sin(Date.now() * 0.006) * 0.05;
        ctx.save();
        ctx.translate(V_WIDTH / 2, 500);
        ctx.scale(pulse, pulse);

        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.roundRect(-100, -26, 200, 52, 26);
        ctx.fill();

        ctx.font = "bold 20px 'Arial Rounded MT Bold', sans-serif";
        ctx.fillStyle = '#0f172a';
        ctx.fillText('RETRY', 0, 7);
        ctx.restore();

        ctx.restore();
    }

    // --- Main Game Loop ---
    function gameLoop() {
        // Update Game Logic
        if (gameState === STATE.PLAYING) {
            glider.update();
            pouch.update();
            checkCollision();
        } else if (gameState === STATE.TITLE) {
            pouch.update();
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        // Update Floating Texts
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].update();
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }

        // Render Frame
        drawBackground(ctx);
        drawBranch(ctx);

        // Draw pouch back layer & rope
        pouch.drawRopeAndBack(ctx);

        // Draw glider (if in pouch, it renders between pouch back and front flap)
        if (gameState === STATE.PLAYING) {
            glider.draw(ctx);
        }

        // Draw pouch front layer
        pouch.drawFront(ctx);

        // Draw Effects
        particles.forEach(p => p.draw(ctx));
        floatingTexts.forEach(ft => ft.draw(ctx));

        // Draw HUD / Overlay Screens
        if (gameState === STATE.PLAYING) {
            drawHUD(ctx);
        } else if (gameState === STATE.TITLE) {
            drawTitleScreen(ctx);
        } else if (gameState === STATE.GAMEOVER) {
            drawGameOverScreen(ctx);
        }

        requestAnimationFrame(gameLoop);
    }

    // Start Loop on Window Load
    window.onload = () => {
        gameLoop();
    };
})();
</script>
</body>
